name: Build Windows Binary

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install NASM
        run: choco install nasm -y

      - name: Assemble and Link sitt-win.exe
        run: |
          $env:PATH += ";C:\Program Files\NASM"
          nasm -f win64 sitt-win.asm -o sitt-win.obj
          curl.exe -L -o golink.zip http://www.godevtool.com/Golink.zip
          Expand-Archive golink.zip -DestinationPath golink_bin -Force
          .\golink_bin\GoLink.exe /console /entry _start sitt-win.obj kernel32.dll

      - name: Smoke Test
        run: |
          chcp 65001
          $out = Get-Content -Encoding UTF8 examples\hi.sitt -Raw | .\sitt-win.exe
          if ($out -ne "HI") { throw "Expected HI, got '$out'" }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitt-win-x64
          path: sitt-win.exe

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sitt-win.exe

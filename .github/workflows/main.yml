name: Build Windows Binary

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        run: choco install nasm -y

      - name: Assemble and Link sitt.exe
        run: |
          $env:PATH += ";C:\Program Files\NASM"
          nasm -f win64 sitt.asm -o sitt.obj
          curl.exe -L -o golink.zip http://www.godevtool.com/Golink.zip
          Expand-Archive golink.zip -DestinationPath golink_bin -Force
          .\golink_bin\GoLink.exe /console /entry _start sitt.obj kernel32.dll

      - name: Smoke Test Interpreter and AOT Compiler
        run: |
          chcp 65001
          $out = Get-Content -Encoding UTF8 examples\hi.sitt -Raw | .\sitt.exe
          if ($out -ne "HI") { throw "Interpreter expected HI, got '$out'" }

          # Test --exe (Windows GUI PE binary)
          cmd /c "sitt.exe --exe < examples\ass_hi.sitt > compiled.exe"
          $peBytes = [System.IO.File]::ReadAllBytes("compiled.exe")
          if ($peBytes[0] -ne 0x4D -or $peBytes[1] -ne 0x5A) { throw "Invalid PE header in compiled.exe" }

          # Test --elf (Linux ELF64 binary)
          cmd /c "sitt.exe --elf < examples\hi.sitt > compiled.elf"
          $elfBytes = [System.IO.File]::ReadAllBytes("compiled.elf")
          if ($elfBytes[0] -ne 0x7F -or $elfBytes[1] -ne 0x45) { throw "Invalid ELF header in compiled.elf" }

          # Test --app (macOS .app bundle)
          Get-Content -Encoding UTF8 examples\hi.sitt -Raw | .\sitt.exe --app
          if (-not (Test-Path "out.app\Contents\MacOS\out")) { throw "Missing out.app Mach-O binary" }
          if (-not (Test-Path "out.app\Contents\Info.plist")) { throw "Missing out.app Info.plist" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitt-win-x64
          path: sitt.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sitt.exe
